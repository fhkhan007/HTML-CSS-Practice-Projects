<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Survey Form</title>
  </head>
  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">
      Thank you for taking the time to help us improve the platform
    </p>
    <form method="post" action="" id="survey-form">
      <label for="name" id="name-label">
        Name
        <input type="text" id="name" placeholder="Enter your name" required />
      </label>

      <label for="email" id="email-label"
        >Email
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        />
      </label>

      <label for="age" id="number-label"
        >Age(optional)
        <input type="number" id="number" placeholder="Age" min="18" max="100"
      /></label>

      <label for="role"
        >Which option best describes your current role?
        <select name="option" id="dropdown">
          <option value="student">Student</option>
          <option value="jobholder">Jobholder</option>
        </select>
      </label>

      <p>Would you recommend freeCodeCamp to a friend?</p>
      <input type="radio" id="definitely" name="recommend" value="definitely" />
      <label for="definitely">Definitely</label>

      <input type="radio" id="maybe" name="recommend" value="maybe" />
      <label for="maybe">Maybe</label>

      <p>What would you like to see improved? (Check all that apply)</p>
      <input
        type="checkbox"
        id="front-end"
        name="improvements"
        value="front-end"
      />
      <label for="front-end">Front-end Projects</label>

      <input
        type="checkbox"
        id="back-end"
        name="improvements"
        value="back-end"
      />
      <label for="back-end">Back-end Projects</label>

      <input
        type="checkbox"
        id="data-visualization"
        name="improvements"
        value="data-visualization"
      />
      <label for="data-visualization">Data Visualization</label>

      <label for="comments">Any comments or suggestions?</label>
      <textarea
        name="comments"
        id="comments"
        placeholder="Write your comments here..."
      ></textarea>

      <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
