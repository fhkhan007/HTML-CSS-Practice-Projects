<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Survey Form</title>
</head>
<body>
    <h1>freeCodeCamp Survey Form</h1>
    <p>Thank you for taking the time to help us improve the platform</p>
    <form method="post" action="" id="survey-form">
        
           <label for="name" id="name-label"> Name  <input type="text" id="name" placeholder="Enter your name" required> </label>
          
           <label for="email" id="email-label">Email  <input type="text" id="email" placeholder="Enter your email" required> </label>

           <label for="age" id="number-label">Age(optional) <input type="number" id="number" min="18" max="100"></label>

           <label for="">Which option best describes your current role? </label>
        

    </form>
</body>
</html>
